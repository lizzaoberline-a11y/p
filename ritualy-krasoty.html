<meta name="theme-color" content="#1e110c">

22 cy=%22464%22 r=%2219%22 fill=%22url%28%23pearl%29%22/%3E    %3Ccircle cx=%22287%22 cy=%22464%22 r=%2219%22 fill=%22url%28%23pearl%29%22/%3E    %3Ccircle cx=%22330%22 cy=%22459%22 r=%2217%22 fill=%22url%28%23pearl%29%22/%3E    %3Ccircle cx=%22372%22 cy=%22448%22 r=%2217%22 fill=%22url%28%23pearl%29%22/%3E    %3Ccircle cx=%22410%22 cy=%22430%22 r=%2217%22 fill=%22url%28%23pearl%29%22/%3E  %3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Marck+Script&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --espresso:#1e110c; --cocoa:#3a2218; --mocha:#5a3a29; --caramel:#b98a63; --latte:#dcc3a4;
  --cream:#f1e3d1; --gold:#c9a45c; --gold-hi:#f3dc9b; --burg:#7d1d22;
  --script:'Marck Script','Segoe Script','Brush Script MT',cursive;
  --display:'Playfair Display','Didot','Bodoni 72',Georgia,serif;
  --text:'Cormorant Garamond','Cormorant',Garamond,'Palatino Linotype',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--espresso);-webkit-text-size-adjust:100%}
body{
  font-family:var(--text);font-size:19px;font-weight:500;line-height:1.35;color:var(--cream);min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(1100px 650px at 12% -8%,#4d2c1d 0,transparent 62%),
    radial-gradient(900px 600px at 100% 28%,#3d1a1c 0,transparent 58%),
    var(--espresso);
}
body::before{content:"";position:fixed;inset:0;background:var(--leo);background-size:240px;opacity:.07;pointer-events:none}
body::after{content:"";position:fixed;inset:0;background:var(--grain);opacity:.12;mix-blend-mode:overlay;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 56px;position:relative;z-index:1}

/* ---------- hero ---------- */
.hero{position:relative;z-index:1;text-align:center}
.leo-band{height:44px;background:var(--leo),#7a4e2c;background-size:200px;border-bottom:3px solid var(--gold);box-shadow:0 1px 0 #0008,0 8px 24px -8px #000a;position:relative}
.leo-band::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:1px;background:var(--gold);opacity:.6}
.hero-in{padding:38px 20px 8px}
.eyebrow{font:600 13px var(--display);letter-spacing:.5em;text-transform:uppercase;color:var(--gold);padding-left:.5em}
.hero h1{font:400 clamp(58px,11vw,128px)/1 var(--script);margin:6px 0 0;
  background:linear-gradient(180deg,#fff1c9 0,var(--gold-hi) 30%,var(--gold) 62%,#9a7230 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 14px #0009);padding:0 .1em .12em}
.hero .sub{font:italic 500 22px var(--text);color:var(--latte);margin-top:2px}
.quote{font:italic 500 21px var(--text);color:var(--latte);margin-top:14px;min-height:1.4em}
.pearls{height:22px;margin:16px auto 0;max-width:640px;
  background:radial-gradient(circle at 36% 30%,#fff 0,#f1e4d4 32%,#b59d84 78%,transparent 80%) 0 50%/22px 22px repeat-x;
  -webkit-mask:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);mask:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);
  filter:drop-shadow(0 3px 3px #0008)}

/* ---------- tones ---------- */
.t-cream{--bg:#f1e3d1;--fg:#2a1810;--mute:#7a5a45;--line:rgba(120,80,40,.3);--accent:#7d1d22;--gold-line:rgba(169,125,50,.6)}
.t-mocha{--bg:#4a2d20;--fg:#f1e3d1;--mute:#c9ad92;--line:rgba(217,188,156,.28);--accent:#e8c97f;--gold-line:rgba(201,164,92,.55)}
.t-caramel{--bg:#c29668;--fg:#241209;--mute:#5c3a22;--line:rgba(36,18,9,.3);--accent:#5b1a1d;--gold-line:rgba(36,18,9,.35)}
.t-burg{--bg:#5b1a1d;--fg:#f4e4d2;--mute:#dcaaa2;--line:rgba(244,228,210,.28);--accent:#e8c97f;--gold-line:rgba(201,164,92,.6)}
.t-latte{--bg:#dcc3a4;--fg:#2a1810;--mute:#6b4a34;--line:rgba(60,35,20,.3);--accent:#7d1d22;--gold-line:rgba(120,80,30,.45)}
.t-choc{--bg:#2e1a12;--fg:#f1e3d1;--mute:#bfa186;--line:rgba(217,188,156,.25);--accent:#e8c97f;--gold-line:rgba(201,164,92,.5)}

.card{background:var(--bg);color:var(--fg);border-radius:28px;padding:28px 26px 24px;position:relative;
  box-shadow:0 22px 40px -22px #000,0 2px 0 #fff2 inset}
.card::after{content:"";position:absolute;inset:8px;border:1px solid var(--gold-line);border-radius:21px;pointer-events:none}
.script{font-family:var(--script);font-weight:400}

/* ---------- top grid ---------- */
.top{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:28px;margin-top:30px;align-items:start}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-title{text-align:center;line-height:1}
.cal-title .script{font-size:52px;color:var(--accent)}
.cal-title .yr{display:block;font:600 13px var(--display);letter-spacing:.45em;color:var(--mute);margin-top:2px;padding-left:.45em}
.nav{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);font:500 20px var(--display);display:grid;place-items:center;transition:.2s}
.nav:hover{background:var(--fg);color:var(--bg)}
.wd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font:600 12px var(--display);letter-spacing:.2em;color:var(--mute);text-transform:uppercase;margin:10px 0 6px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px}
.day{aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;font:600 17px var(--display);
  background:conic-gradient(var(--gold) var(--p,0deg),rgba(90,58,41,.14) 0);transition:transform .15s}
.day::before{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--bg)}
.day span{position:relative;z-index:1}
.day:hover{transform:scale(1.07)}
.day.out{visibility:hidden}
.day.fut{background:rgba(90,58,41,.1);color:var(--mute)}
.day.full{background:linear-gradient(145deg,var(--gold-hi),var(--gold) 55%,#8e6a2c)}
.day.full::before{background:linear-gradient(145deg,#fbf0d6,#e9d3a1);}
.day.today span{color:var(--burg);font-weight:700}
.day.today::after{content:"";position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--burg);z-index:2}
.day.sel{outline:2px solid var(--burg);outline-offset:2px}
.day.extra i{position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 35% 30%,#fff,#d9c3a7 55%,#9d8468);box-shadow:0 1px 2px #0006}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;font:italic 500 16px var(--text);color:var(--mute);margin:14px 0 4px}
.legend b{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);text-align:center}
.stat .n{font:400 44px/1 var(--script);color:var(--accent)}
.stat .l{font:600 11px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:4px}

/* day panel */
.dp-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dp-head .script{font-size:54px;line-height:1;color:var(--accent)}
.dp-head .wdn{font:italic 500 20px var(--text);color:var(--mute)}
.bar{height:10px;border-radius:99px;background:rgba(241,227,209,.14);margin:14px 0 6px;overflow:hidden;box-shadow:inset 0 1px 3px #0008}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8e6a2c,var(--gold-hi),var(--gold));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.prog{display:flex;justify-content:space-between;font:italic 500 17px var(--text);color:var(--mute)}
.win{font:400 30px var(--script);color:var(--accent);text-align:center;margin-top:10px}
.grp{margin-top:18px}
.grp h4{font:600 12px var(--display);letter-spacing:.32em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px}
.grp h4::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{font:italic 500 17px var(--text);color:var(--mute);padding:8px 0}
.hint{font:italic 500 17px var(--text);color:var(--mute);margin-top:18px;text-align:center}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.pearl{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--fg);position:relative;transition:.25s;opacity:.8}
.pearl:hover{opacity:1;transform:scale(1.08)}
.pearl[aria-pressed=true]{border-color:transparent;opacity:1;
  background:radial-gradient(circle at 32% 28%,#fff 0,#f7ede1 26%,#d8c3ab 68%,#a58b6e 100%);
  box-shadow:0 2px 6px #0006,inset 0 -2px 3px rgba(80,50,30,.28)}
.pearl[aria-pressed=true]::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#7d1d22;font:700 15px var(--display)}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.nm{min-width:0;font-size:20px;line-height:1.15;transition:.25s}
.row.done .nm{opacity:.55;text-decoration:line-through;text-decoration-thickness:1px}
.chip{flex:none;max-width:100%;font:italic 500 14.5px/1 var(--text);padding:4px 10px 5px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:normal}
.chip.late{background:#8c2327;border-color:#8c2327;color:#fff}
.chip.due{background:var(--gold);border-color:var(--gold);color:#2a1810;font-weight:600}
.chip.ok{border-color:var(--accent);color:var(--accent)}
.ed{flex:none;width:28px;height:28px;border-radius:50%;opacity:.4;font-size:15px;transition:.2s}
.ed:hover{opacity:1;background:var(--line)}
.add{width:100%;margin-top:12px;padding:10px;border:1.5px dashed var(--line);border-radius:16px;font:italic 500 18px var(--text);color:var(--mute);transition:.2s}
.add:hover{border-color:var(--fg);color:var(--fg)}

/* masonry */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:54px 0 20px}
.sec-head h2{font:400 clamp(44px,6vw,64px)/1 var(--script);color:var(--gold-hi)}
.sec-head p{font:italic 500 19px var(--text);color:var(--latte)}
.sec-head button{border:1px solid var(--gold);color:var(--gold-hi);border-radius:99px;padding:5px 16px 6px;font:italic 500 17px var(--text);margin-left:8px}
.sec-head button:hover{background:var(--gold);color:var(--espresso)}
.masonry{columns:3 320px;column-gap:24px}
.masonry>*{break-inside:avoid;margin-bottom:24px;display:block}
.s-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.s-num{font:600 12px var(--display);letter-spacing:.3em;color:var(--mute)}
.s-cnt{font:600 12px var(--display);letter-spacing:.14em;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--mute)}
.s-title{font:400 46px/1 var(--script);color:var(--accent);margin-top:6px}
.s-sub{font:italic 500 18px var(--text);color:var(--mute);margin:2px 0 12px}
.s-sub b{font:600 11px var(--display);letter-spacing:.22em;text-transform:uppercase;font-style:normal;color:var(--fg)}
.qcard{text-align:center;padding:38px 26px 34px;overflow:hidden;background:var(--leo),#5b1a1d;background-size:200px}
.qcard::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(60,12,16,.93) 0,rgba(60,12,16,.8) 62%,rgba(60,12,16,.55));border-radius:inherit}
.qcard>*{position:relative;z-index:1}
.qcard .mk{font:400 70px/0.6 var(--display);color:var(--gold)}
.qcard .q{font:400 38px/1.15 var(--script);color:#fbefd8;margin:8px 0 12px}
.qcard .a{font:600 11px var(--display);letter-spacing:.4em;text-transform:uppercase;color:var(--gold);padding-left:.4em}

/* footer & dialog */
footer{margin-top:20px;text-align:center;font:italic 500 17px var(--text);color:var(--mute)}
footer .tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
footer .tools button,footer .tools label{border:1px solid rgba(217,188,156,.3);border-radius:99px;padding:5px 15px 6px;color:var(--latte);cursor:pointer;font:italic 500 16px var(--text)}
footer .tools button:hover,footer .tools label:hover{border-color:var(--gold);color:var(--gold-hi)}
dialog{border:0;border-radius:26px;padding:0;background:transparent;color:#2a1810;max-width:min(440px,92vw);width:100%;margin:auto}
dialog::backdrop{background:rgba(20,10,6,.72);backdrop-filter:blur(4px)}
dialog form{background:#f1e3d1;border-radius:26px;padding:28px 26px 24px;position:relative;box-shadow:0 30px 60px -20px #000}
dialog form::after{content:"";position:absolute;inset:8px;border:1px solid rgba(169,125,50,.6);border-radius:19px;pointer-events:none}
dialog h3{font:400 44px/1 var(--script);color:var(--burg);margin-bottom:14px}
dialog label,dialog .lbl{display:block;font:600 11px var(--display);letter-spacing:.25em;text-transform:uppercase;color:#7a5a45;margin-top:14px}
dialog input,dialog select{display:block;width:100%;margin-top:6px;padding:9px 14px;border-radius:14px;border:1px solid rgba(120,80,40,.4);background:#fbf4ea;font:500 20px var(--text);color:#2a1810;text-transform:none;letter-spacing:0}
dialog input:focus,dialog select:focus{outline:2px solid var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips label{margin:0;letter-spacing:.05em}
.chips input{position:absolute;opacity:0;width:0;height:0}
.chips span{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid rgba(120,80,40,.4);font:600 13px var(--display);letter-spacing:0;color:#5a3a29;cursor:pointer;text-transform:none}
.chips input:checked+span{background:#4a2d20;color:#f3dc9b;border-color:#4a2d20}
.btns{display:flex;gap:10px;align-items:center;margin-top:24px;position:relative;z-index:1}
.btns button{border-radius:99px;padding:8px 20px 9px;border:1px solid rgba(120,80,40,.45);font:italic 500 18px var(--text);color:#2a1810}
.btns .primary{background:#4a2d20;border-color:#4a2d20;color:#f3dc9b}
.btns .danger{color:#8c2327;border-color:transparent}
.hidden{display:none!important}

@media(max-width:900px){.top{grid-template-columns:1fr}}
@media(max-width:560px){
  body{font-size:18px}.wrap{padding:0 14px 44px}.card{padding:24px 18px 20px;border-radius:24px}
  .cal-title .script{font-size:44px}.day{font-size:15px}.dp-head .script{font-size:46px}
  .masonry{columns:1}.chip{font-size:13.5px;padding:3px 8px 4px}.nm{font-size:19px}
  .hero-in{padding-top:28px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="leo-band"></div>
  <div class="hero-in">
    <p class="eyebrow">трекер ухода за собой</p>
    <h1>Мои ритуалы</h1>
    <p class="sub">красоты, нежности и немного роскоши</p>
    <p class="quote" id="quote"></p>
    <div class="pearls"></div>
  </div>
</header>

<main class="wrap">
  <div class="top">
    <section class="card t-cream" id="cal" aria-label="Календарь"></section>
    <section class="card t-mocha" id="day" aria-live="polite"></section>
  </div>

  <div class="sec-head">
    <div>
      <h2>Все ритуалы</h2>
      <p id="selnote"></p>
    </div>
    <div><button data-act="add" data-sec="morning">+ новая процедура</button></div>
  </div>
  <div class="masonry" id="secs"></div>

  <footer>
    <div class="pearls" style="margin-bottom:12px"></div>
    всё хранится только в этом браузере
    <div class="tools">
      <button id="bExport">сохранить копию</button>
      <label>загрузить копию<input type="file" id="bImport" accept="application/json" hidden></label>
      <button id="bReset">начать заново</button>
    </div>
  </footer>
</main>

<dialog id="dlg">
  <form id="frm">
    <h3 id="dlgT">Новая процедура</h3>
    <label>Название<input id="fName" maxlength="60" autocomplete="off" placeholder="например, маска для лица"></label>
    <label>Раздел<select id="fSec"></select></label>
    <div id="fDaysWrap"><span class="lbl">В какие дни</span><div class="chips" id="fDays"></div></div>
    <label id="fEveryWrap">Повторять раз в (дней)<input id="fEvery" type="number" min="1" max="730"></label>
    <div class="btns">
      <button type="button" class="danger" id="fDel">Удалить</button>
      <span style="flex:1"></span>
      <button type="button" id="fCancel">Отмена</button>
      <button type="submit" class="primary">Сохранить</button>
    </div>
  </form>
</dialog>

<script>
/* ---------- декор: леопард и зерно ---------- */
(function(){
  const spots=[[40,46,22,20],[130,24,18,150],[205,92,24,80],[78,128,20,230],[160,170,23,310],[30,205,19,100],[225,215,20,190],[110,222,17,40]];
  let g='';
  for(const dx of [-240,0,240])for(const dy of [-240,0,240])for(const [x,y,r,a] of spots){
    g+=`<ellipse cx="0" cy="0" rx="${r}" ry="${r*.72}" fill="#a06a38" stroke="#140a06" stroke-width="${r*.42}" stroke-dasharray="${r*2.7} ${r*.95}" stroke-linecap="round" transform="translate(${x+dx} ${y+dy}) rotate(${a})"/>`;
  }
  const leo=`<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240"><rect width="240" height="240" fill="#7a4e2c"/>${g}</svg>`;
  const leoT=`<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">${g}</svg>`;
  const grain=`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .9 0"/></filter><rect width="200" height="200" filter="url(#n)"/></svg>`;
  const u=s=>`url("data:image/svg+xml;utf8,${encodeURIComponent(s)}")`;
  const st=document.documentElement.style;
  st.setProperty('--leo',u(leo)); st.setProperty('--leoT',u(leoT)); st.setProperty('--grain',u(grain));
})();

/* ---------- утилиты ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diff=(a,b)=>Math.round((a-b)/864e5);
const wdIdx=d=>(d.getDay()+6)%7;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WD_FULL=['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const QUOTES=['«Ухаживать за собой — не роскошь, а ритуал»','«Дорогая, ты — событие»','«Красота — это привычка, а не случайность»','«Жемчуг, шоколад и SPF»','«Сегодня я выбираю себя»','«Мягкая кожа, твёрдый характер»','«Роскошь — это время для себя»','«Всё, что нужно, — немного заботы и много шика»'];

/* ---------- разделы ---------- */
const SECS=[
 {id:'morning', num:'I',   script:'Утро',      title:'Утренний ритуал',   sub:'каждый день',        kind:'daily',    tone:'cream'},
 {id:'evening', num:'II',  script:'Вечер',     title:'Вечерний ритуал',   sub:'каждый день',        kind:'daily',    tone:'mocha'},
 {id:'weekly',  num:'III', script:'Неделя',    title:'Раз в неделю',      sub:'по дням недели',     kind:'weekly',   tone:'caramel'},
 {id:'biweekly',num:'IV',  script:'Две недели',title:'Раз в 2–3 недели',  sub:'красота на поддержке',kind:'interval', tone:'burg', every:14},
 {id:'monthly', num:'V',   script:'Месяц',     title:'Раз в месяц–два',   sub:'большие выходы',     kind:'interval', tone:'latte', every:30},
 {id:'season',  num:'VI',  script:'Сезон',     title:'Раз в сезон',       sub:'3–6 месяцев',        kind:'interval', tone:'choc', every:90},
 {id:'wish',    num:'VII', script:'Для души',  title:'По настроению',     sub:'без расписания',     kind:'free',     tone:'mocha'},
];
const secOf=id=>SECS.find(s=>s.id===id);

function seed(){
  let n=0;const mk=(sec,name,extra={})=>({id:'p'+(++n),sec,name,...extra});
  return {items:[
    mk('morning','Умывание и тоник'),mk('morning','Сыворотка с витамином C'),mk('morning','Крем для лица'),mk('morning','SPF — обязательно'),mk('morning','Бальзам для губ'),mk('morning','Стакан воды с лимоном'),
    mk('evening','Двойное очищение'),mk('evening','Эссенция и сыворотка'),mk('evening','Ночной крем'),mk('evening','Крем для рук и кутикулы'),mk('evening','Расчесать волосы'),
    mk('weekly','Маска для лица',{days:[2]}),mk('weekly','Гуаша-массаж лица',{days:[0,3]}),mk('weekly','Пилинг кислотами',{days:[4]}),mk('weekly','Маска для волос',{days:[5]}),mk('weekly','Скраб для тела',{days:[6]}),mk('weekly','Ванна с солью и маслами',{days:[6]}),
    mk('biweekly','Маникюр'),mk('biweekly','Педикюр',{every:21}),mk('biweekly','Коррекция бровей'),mk('biweekly','Эпиляция',{every:21}),
    mk('monthly','Тонирование / окрашивание'),mk('monthly','Стрижка кончиков',{every:45}),mk('monthly','Косметолог'),mk('monthly','Массаж'),
    mk('season','Ревизия косметички'),mk('season','Заменить зубную щётку'),mk('season','Осмотр у дерматолога',{every:180}),
    mk('wish','Спа-день дома'),mk('wish','Баня'),mk('wish','Ванна при свечах'),mk('wish','Новый оттенок помады'),mk('wish','Фотосессия для себя'),
  ],log:{},n};
}

/* ---------- хранение ---------- */
const KEY='ritualy-beauty-v1';
let mem=null;
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);if(s&&Array.isArray(s.items))return s}}catch(e){}
  return mem||seed();
}
function save(){mem=state;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
let state=load();
const todayD=()=>{const d=new Date();d.setHours(12,0,0,0);return d};
let sel=ymd(todayD());
let view={y:todayD().getFullYear(),m:todayD().getMonth()};

/* ---------- логика ---------- */
const items=sec=>state.items.filter(i=>i.sec===sec);
const isDone=(id,ds)=>(state.log[ds]||[]).includes(id);
function toggle(id,ds){
  const a=state.log[ds]||(state.log[ds]=[]);const k=a.indexOf(id);
  if(k>=0)a.splice(k,1);else a.push(id);
  if(!a.length)delete state.log[ds];
  save();render();
}
function lastDone(id,ds){let best=null;for(const k in state.log){if(k<=ds&&state.log[k].includes(id)&&(!best||k>best))best=k}return best}
function info(it,ds){
  const sec=secOf(it.sec);
  if(sec.kind==='daily')return {cls:'',text:'',due:false};
  if(sec.kind==='weekly'){
    const d=parse(ds),ws=addDays(d,-wdIdx(d));let wk=false;
    for(let i=0;i<7;i++)if(isDone(it.id,ymd(addDays(ws,i)))){wk=true;break}
    const days=it.days||[];
    if(isDone(it.id,ds))return {cls:'ok',text:'сегодня ✓',due:false};
    if(wk)return {cls:'ok',text:'на этой неделе ✓',due:false};
    if(days.includes(wdIdx(d)))return {cls:'due',text:'по плану сегодня',due:true};
    return {cls:'',text:days.length?days.map(i=>WD[i]).join(', '):'выбери дни',due:false};
  }
  const last=lastDone(it.id,ds);
  if(sec.kind==='free')return {cls:last===ds?'ok':'',text:last===ds?'сегодня ✓':last?`было ${diff(parse(ds),parse(last))} дн назад`:'когда захочется',due:false};
  const every=it.every||sec.every;
  if(!last)return {cls:'',text:`раз в ${every} дн · ещё не было`,due:false};
  const ago=diff(parse(ds),parse(last));
  if(ago===0)return {cls:'ok',text:'сегодня ✓',due:false};
  const left=every-ago;
  if(left<0)return {cls:'late',text:`пора была ${-left} дн назад`,due:true};
  if(left===0)return {cls:'due',text:'пора сегодня',due:true};
  return {cls:'',text:`через ${left} дн · было ${ago} дн назад`,due:false};
}
const dailyItems=()=>state.items.filter(i=>secOf(i.sec).kind==='daily');
function dayFrac(ds){const dl=dailyItems();if(!dl.length)return 0;return dl.filter(i=>isDone(i.id,ds)).length/dl.length}
function extraDone(ds){const ids=state.log[ds]||[];return ids.some(id=>{const it=state.items.find(i=>i.id===id);return it&&secOf(it.sec).kind!=='daily'})}
function perfect(ds){const dl=dailyItems();return dl.length>0&&dl.every(i=>isDone(i.id,ds))}
function streak(){let d=todayD(),n=0;if(!perfect(ymd(d)))d=addDays(d,-1);while(perfect(ymd(d))&&n<3650){n++;d=addDays(d,-1)}return n}

/* ---------- отрисовка ---------- */
function rowHTML(it,ds,withEdit){
  const done=isDone(it.id,ds),inf=info(it,ds);
  return `<div class="row ${done?'done':''}">
    <button class="pearl" data-act="toggle" data-id="${it.id}" aria-pressed="${done}" aria-label="Отметить: ${esc(it.name)}"></button>
    <div class="mid"><span class="nm">${esc(it.name)}</span>${inf.text?`<span class="chip ${inf.cls}">${esc(inf.text)}</span>`:''}</div>
    ${withEdit?`<button class="ed" data-act="edit" data-id="${it.id}" aria-label="Изменить">✎</button>`:''}
  </div>`;
}

function renderCal(){
  const {y,m}=view,first=new Date(y,m,1,12),off=wdIdx(first),dim=new Date(y,m+1,0).getDate(),tk=ymd(todayD());
  let cells='';
  for(let i=0;i<off;i++)cells+='<div class="day out"></div>';
  let perfDays=0,marks=0;
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${pad(m+1)}-${pad(d)}`,fut=ds>tk,fr=fut?0:dayFrac(ds),full=!fut&&fr===1&&dailyItems().length>0;
    if(full)perfDays++;
    marks+=(state.log[ds]||[]).filter(id=>state.items.some(i=>i.id===id)).length;
    cells+=`<button class="day ${fut?'fut':''} ${full?'full':''} ${ds===tk?'today':''} ${ds===sel?'sel':''} ${!fut&&extraDone(ds)?'extra':''}" style="--p:${fr*360}deg" data-day="${ds}" aria-label="${d} ${MONTHS_G[m]}"><span>${d}</span>${!fut&&extraDone(ds)?'<i></i>':''}</button>`;
  }
  $('#cal').innerHTML=`
    <div class="cal-head">
      <button class="nav" data-act="prev" aria-label="Предыдущий месяц">‹</button>
      <div class="cal-title"><span class="script">${MONTHS[m]}</span><span class="yr">${y}</span></div>
      <button class="nav" data-act="next" aria-label="Следующий месяц">›</button>
    </div>
    <div class="wd">${WD.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="grid">${cells}</div>
    <div class="legend"><span><b style="background:var(--gold)"></b>ежедневные ритуалы</span><span><b style="background:radial-gradient(circle at 35% 30%,#fff,#d9c3a7 55%,#9d8468)"></b>особая процедура</span></div>
    <div class="stats">
      <div class="stat"><div class="n">${streak()}</div><div class="l">дней подряд</div></div>
      <div class="stat"><div class="n">${perfDays}</div><div class="l">идеальных дней</div></div>
      <div class="stat"><div class="n">${marks}</div><div class="l">отметок за месяц</div></div>
    </div>`;
}

function renderDay(){
  const d=parse(sel),tk=ymd(todayD()),wd=wdIdx(d);
  const morning=items('morning'),evening=items('evening');
  const sched=state.items.filter(it=>{
    const k=secOf(it.sec).kind;if(k==='daily')return false;
    if(isDone(it.id,sel))return true;
    if(k==='weekly')return (it.days||[]).includes(wd);
    if(k==='interval')return info(it,sel).due;
    return false;
  });
  const all=[...morning,...evening,...sched],dn=all.filter(i=>isDone(i.id,sel)).length,pct=all.length?Math.round(dn/all.length*100):0;
  const grp=(t,arr,empty)=>`<div class="grp"><h4>${t}</h4>${arr.length?arr.map(i=>rowHTML(i,sel,false)).join(''):`<p class="empty">${empty}</p>`}</div>`;
  const rel=sel===tk?'сегодня':sel===ymd(addDays(todayD(),-1))?'вчера':sel===ymd(addDays(todayD(),1))?'завтра':'';
  $('#day').innerHTML=`
    <div class="dp-head">
      <div><div class="script">${d.getDate()} ${MONTHS_G[d.getMonth()]}</div><div class="wdn">${WD_FULL[wd]}${rel?' · '+rel:''}</div></div>
      ${sel!==tk?'<button class="chip" data-act="today" style="font-size:16px;padding:6px 14px">вернуться к сегодня</button>':''}
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="prog"><span>${dn} из ${all.length}</span><span>${pct}%</span></div>
    ${all.length&&dn===all.length?'<div class="win">Идеальный день, дорогая ✦</div>':''}
    ${grp('Утро',morning,'Добавь утренние ритуалы в разделе ниже')}
    ${grp('Вечер',evening,'Добавь вечерние ритуалы в разделе ниже')}
    ${grp('По расписанию',sched,'На этот день особых процедур нет')}
    <p class="hint">Хочется чего-то ещё? Отметь любую процедуру ниже — она запишется на выбранный день.</p>`;
}

function renderSecs(){
  const q=QUOTES[Math.floor((todayD()-new Date(todayD().getFullYear(),0,0))/864e5+3)%QUOTES.length];
  let html=`<article class="card t-burg qcard"><div class="mk">“</div><div class="q">${esc(q.replace(/[«»]/g,''))}</div><div class="a">ритуал на сегодня</div></article>`;
  for(const s of SECS){
    const its=items(s.id),dn=its.filter(i=>isDone(i.id,sel)).length;
    const cnt=s.kind==='daily'?`${dn} / ${its.length}`:`${its.length}`;
    html+=`<article class="card t-${s.tone}">
      <div class="s-top"><span class="s-num">${s.num}</span><span class="s-cnt">${cnt}</span></div>
      <h3 class="s-title">${s.script}</h3>
      <p class="s-sub"><b>${s.title}</b> · ${s.sub}</p>
      ${its.map(i=>rowHTML(i,sel,true)).join('')||'<p class="empty">Пока пусто</p>'}
      <button class="add" data-act="add" data-sec="${s.id}">+ добавить</button>
    </article>`;
  }
  $('#secs').innerHTML=html;
  const d=parse(sel);
  $('#selnote').innerHTML=`отмечаешь за ${d.getDate()} ${MONTHS_G[d.getMonth()]}${sel!==ymd(todayD())?' · <a href="#" data-act="today" style="color:var(--gold-hi)">к сегодня</a>':''}`;
}
function render(){renderCal();renderDay();renderSecs()}

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-day]');if(!t)return;
  if(t.dataset.day){sel=t.dataset.day;const d=parse(sel);view={y:d.getFullYear(),m:d.getMonth()};render();return}
  const a=t.dataset.act;
  if(a==='toggle')toggle(t.dataset.id,sel);
  else if(a==='edit')openEdit(t.dataset.id);
  else if(a==='add')openEdit(null,t.dataset.sec);
  else if(a==='prev'||a==='next'){const n=view.m+(a==='next'?1:-1);view={y:view.y+Math.floor(n/12),m:((n%12)+12)%12};renderCal()}
  else if(a==='today'){e.preventDefault();const d=todayD();sel=ymd(d);view={y:d.getFullYear(),m:d.getMonth()};render()}
});

/* ---------- окно добавления / правки ---------- */
const dlg=$('#dlg');let editId=null;
$('#fSec').innerHTML=SECS.map(s=>`<option value="${s.id}">${s.title}${s.kind==='daily'?'':' — '+s.sub}</option>`).join('');
$('#fDays').innerHTML=WD.map((w,i)=>`<label><input type="checkbox" value="${i}"><span>${w}</span></label>`).join('');
function syncForm(){
  const k=secOf($('#fSec').value).kind;
  $('#fDaysWrap').classList.toggle('hidden',k!=='weekly');
  $('#fEveryWrap').classList.toggle('hidden',k!=='interval');
  if(k==='interval'&&!$('#fEvery').value)$('#fEvery').value=secOf($('#fSec').value).every;
}
$('#fSec').addEventListener('change',()=>{const s=secOf($('#fSec').value);if(s.kind==='interval')$('#fEvery').value=s.every;syncForm()});
function openEdit(id,secId){
  editId=id;const it=id?state.items.find(i=>i.id===id):null;
  $('#dlgT').textContent=it?'Изменить':'Новая процедура';
  $('#fName').value=it?it.name:'';
  $('#fSec').value=it?it.sec:(secId||'morning');
  const s=secOf($('#fSec').value);
  $('#fEvery').value=it&&it.every?it.every:(s.every||'');
  const days=it?(it.days||[]):[wdIdx(parse(sel))];
  document.querySelectorAll('#fDays input').forEach(c=>c.checked=days.includes(+c.value));
  $('#fDel').classList.toggle('hidden',!it);
  syncForm();dlg.showModal();setTimeout(()=>$('#fName').focus(),30);
}
$('#frm').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('#fName').value.trim();if(!name){$('#fName').focus();return}
  const sec=$('#fSec').value,k=secOf(sec).kind;
  const data={name,sec};
  if(k==='weekly')data.days=[...document.querySelectorAll('#fDays input:checked')].map(c=>+c.value);
  if(k==='interval'){const v=parseInt($('#fEvery').value,10);if(v>0&&v!==secOf(sec).every)data.every=v}
  if(editId){const it=state.items.find(i=>i.id===editId);delete it.days;delete it.every;Object.assign(it,data)}
  else{state.n=(state.n||state.items.length)+1;state.items.push({id:'p'+state.n+'_'+Date.now().toString(36),...data})}
  save();dlg.close();render();
});
$('#fCancel').onclick=()=>dlg.close();
$('#fDel').onclick=()=>{
  if(!confirm('Удалить эту процедуру?'))return;
  state.items=state.items.filter(i=>i.id!==editId);save();dlg.close();render();
};
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

/* ---------- копия данных ---------- */
$('#bExport').onclick=()=>{
  const b=new Blob([JSON.stringify(state,null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='ritualy-kopiya.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('#bImport').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const s=JSON.parse(r.result);if(!s||!Array.isArray(s.items)||typeof s.log!=='object')throw 0;state=s;save();render()}catch(_){alert('Не получилось прочитать файл')}};
  r.readAsText(f);e.target.value='';
};
$('#bReset').onclick=()=>{if(confirm('Стереть все отметки и вернуть стартовый список?')){state=seed();save();render()}};

$('#quote').textContent=QUOTES[(todayD().getDate()+todayD().getMonth())%QUOTES.length];
render();
</script>
</body>
</html>
